---
# ===========================================================================
# Pull request pipeline.
#
# Everything here has to pass before merge. The ordering is deliberate: the
# cheap, fast checks fail first so a typo is reported in ninety seconds rather
# than after a twelve-minute cluster spin-up.
#
# The last job is the one that matters most — it deploys the whole chart to a
# real (ephemeral) Kubernetes cluster and runs the smoke tests. Everything above
# it tests the code; that one tests the release.
# ===========================================================================
name: CI

on:
  pull_request:
    branches: [main]
  # Also on push to main, so the branch's own history stays verified even if
  # something is merged by an administrator bypassing the PR flow.
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Individual jobs widen this where they genuinely need to.
permissions:
  contents: read

concurrency:
  # One run per branch. A force-push supersedes the previous run rather than
  # queueing behind it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:

  # -------------------------------------------------------------------------
  # Which services actually changed?
  # -------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      web: ${{ steps.filter.outputs.web }}
      charts: ${{ steps.filter.outputs.charts }}
      any_java: ${{ steps.filter.outputs.any_java }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            common: &common
              - 'services/common/**'
              - 'pom.xml'
            api-gateway:
              - 'services/api-gateway/**'
              - *common
            auth-service:
              - 'services/auth-service/**'
              - *common
            menu-service:
              - 'services/menu-service/**'
              - *common
            order-service:
              - 'services/order-service/**'
              - *common
            payment-service:
              - 'services/payment-service/**'
              - *common
            kitchen-service:
              - 'services/kitchen-service/**'
              - *common
            notification-service:
              - 'services/notification-service/**'
              - *common
            web:
              - 'web/**'
            charts:
              - 'deploy/**'
            any_java:
              - 'services/**'
              - 'pom.xml'

      # A change to the shared module affects every service, which the YAML
      # anchors above encode. Without that, a breaking change in `common` would
      # be merged having tested nothing.
      - name: Report what will be built
        run: |
          echo "Services to build: ${{ steps.filter.outputs.changes }}"
          echo "Web: ${{ steps.filter.outputs.web }}"
          echo "Charts: ${{ steps.filter.outputs.charts }}"

  # -------------------------------------------------------------------------
  # Build, unit test and coverage gate, per changed service
  # -------------------------------------------------------------------------
  build-java:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        # `common` and `charts` are filters, not buildable services.
        exclude:
          - service: common
          - service: charts
          - service: web
          - service: any_java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build, test and enforce the coverage gate
        # The gate lives in the parent POM, so `mvn verify` locally fails for
        # exactly the same reason this does.
        run: mvn -B -ntp verify -DskipITs -pl services/${{ matrix.service }} -am

      - name: Coverage summary
        if: always()
        run: |
          CSV="services/${{ matrix.service }}/target/site/jacoco/jacoco.csv"
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1 {miss+=$8; cov+=$9} END {
              printf "### Coverage — `${{ matrix.service }}`\n\n"
              printf "**%.1f%%** line coverage (%d of %d lines)\n\n", \
                     cov*100/(miss+cov), cov, miss+cov
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Integration tests — real PostgreSQL and RabbitMQ via Testcontainers
  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    needs: [changes, build-java]
    if: needs.changes.outputs.any_java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Testcontainers pulls these on first use; doing it here means the pull
      # time is not counted against a test timeout.
      - name: Pre-pull the test images
        run: |
          docker pull postgres:16-alpine &
          docker pull rabbitmq:3.13-management-alpine &
          wait

      - name: Run integration tests
        run: mvn -B -ntp verify -DskipUnitTests
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/'
          retention-days: 7

  # -------------------------------------------------------------------------
  # Angular
  # -------------------------------------------------------------------------
  build-web:
    name: Build web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm run test:ci

      - name: Production build
        working-directory: web
        run: npm run build

  # -------------------------------------------------------------------------
  # Static analysis and secrets
  # -------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build for analysis
        if: matrix.language == 'java-kotlin'
        run: mvn -B -ntp compile -DskipTests

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history. A secret committed and then "removed" in a later
          # commit is still in the history and still compromised.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5  # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # -------------------------------------------------------------------------
  # Container images — built, scanned, not pushed
  # -------------------------------------------------------------------------
  build-images:
    name: Build and scan images
    needs: [changes, build-java]
    if: always() && needs.build-java.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - menu-service
          - order-service
          - payment-service
          - kitchen-service
          - notification-service
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: dinehub/${{ matrix.service }}:pr-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dinehub/${{ matrix.service }}:pr-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          # Fail only on findings that can actually be acted on. A pipeline red
          # for an unfixable CVE teaches people to merge past it, and then it
          # catches nothing.
          ignore-unfixed: true
          exit-code: '0'

      - name: Fail on fixable CRITICAL findings
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dinehub/${{ matrix.service }}:pr-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Confirm the image does not run as root
        run: |
          USER_ID=$(docker run --rm --entrypoint id \
                      dinehub/${{ matrix.service }}:pr-${{ github.sha }} -u)
          echo "Image runs as UID ${USER_ID}"
          if [ "$USER_ID" = "0" ]; then
            echo "::error::dinehub/${{ matrix.service }} runs as root"
            exit 1
          fi

  build-web-image:
    name: Build and scan web image
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: dinehub/web:pr-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dinehub/web:pr-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # -------------------------------------------------------------------------
  # Infrastructure as code
  # -------------------------------------------------------------------------
  validate-charts:
    name: Validate charts and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: helm lint, every environment
        run: |
          for env in dev test prod; do
            echo "::group::helm lint — ${env}"
            # A tag is required: the chart refuses to render without one rather
            # than defaulting to 'latest'. Any value will do for a lint.
            helm lint deploy/helm/dinehub --values "deploy/helm/values-${env}.yaml" \
              --set global.image.tag=lint --strict
            echo "::endgroup::"
          done

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Rendered manifests are valid Kubernetes
        # helm lint checks the chart; this checks what it actually produces
        # against the real Kubernetes schemas. A chart can lint cleanly and
        # render a manifest the API server rejects.
        run: |
          for env in dev test prod; do
            echo "::group::kubeconform — ${env}"
            helm template dinehub deploy/helm/dinehub \
              --values "deploy/helm/values-${env}.yaml" \
              --namespace "dinehub-${env}" \
              --set global.image.tag=kubeconform \
              | kubeconform -strict -summary -verbose \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: Trivy config scan
        # trivy.yaml carries the settings, including the Helm values Trivy needs
        # to render the chart. Without them it cannot template it, skips the
        # chart silently, and reports a clean scan of everything except the
        # files most worth scanning. `.trivyignore.yaml` is the accepted-findings
        # list, referenced from trivy.yaml — it is not the config file.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml

      - name: Assert Trivy actually read the Helm chart
        # A scan that silently skips the chart passes, so the skip is what gets
        # checked rather than the exit code.
        run: |
          set -euo pipefail
          trivy config --config trivy.yaml --format json -o /tmp/trivy.json . 2>/tmp/trivy.log || true
          if grep -q "Failed to render Chart files" /tmp/trivy.log; then
            echo "::error::Trivy could not render the Helm chart, so it was not scanned."
            sed -n '/Failed to render Chart files/p' /tmp/trivy.log
            exit 1
          fi
          count=$(python3 -c "import json;d=json.load(open('/tmp/trivy.json'));print(sum(1 for r in d.get('Results',[]) if 'helm' in r.get('Target','') or 'deploy/helm' in r.get('Target','')))")
          if [ "$count" -eq 0 ]; then
            echo "::error::Trivy produced no results for deploy/helm — the chart was not scanned."
            exit 1
          fi
          echo "Trivy scanned the chart: ${count} result group(s)." >> "$GITHUB_STEP_SUMMARY"

      - name: Production values assert what production needs
        # These are the differences that matter, checked rather than trusted.
        run: |
          set -e
          PROD=deploy/helm/values-prod.yaml
          fail=0
          check() {
            if ! grep -qE "$1" "$PROD"; then
              echo "::error file=${PROD}::$2"
              fail=1
            fi
          }
          check 'replicaCount: *2'            "prod must run at least 2 replicas"
          check 'podDisruptionBudget:'        "prod must define a PodDisruptionBudget"
          check 'autoscaling:'                "prod must define an HPA"
          check 'backup:'                     "prod must define the backup CronJob"
          # Seed data and Swagger must never be on in production.
          if grep -qE 'seedData: *true' "$PROD"; then
            echo "::error file=${PROD}::seed data must not be enabled in prod"; fail=1
          fi
          if grep -qE 'swaggerEnabled: *true' "$PROD"; then
            echo "::error file=${PROD}::Swagger must not be enabled in prod"; fail=1
          fi
          exit $fail

  # -------------------------------------------------------------------------
  # The job that matters: does this release actually deploy?
  # -------------------------------------------------------------------------
  ephemeral-deploy:
    name: Deploy to an ephemeral cluster
    needs: [build-images, validate-charts]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dinehub-ci
          wait: 120s

      - uses: docker/setup-buildx-action@v3

      - name: Build every image into the cluster
        # Built locally and side-loaded, so the test needs no registry and no
        # credentials — which is what makes this job work on a fork's PR.
        run: |
          for svc in api-gateway auth-service menu-service order-service \
                     payment-service kitchen-service notification-service; do
            echo "::group::build ${svc}"
            docker buildx build --load \
              -f "services/${svc}/Dockerfile" \
              -t "dinehub/${svc}:ci" \
              --cache-from "type=gha,scope=${svc}" .
            kind load docker-image "dinehub/${svc}:ci" --name dinehub-ci
            echo "::endgroup::"
          done
          docker buildx build --load -f web/Dockerfile -t dinehub/web:ci \
            --cache-from type=gha,scope=web .
          kind load docker-image dinehub/web:ci --name dinehub-ci

      - name: Create the namespace and its secrets
        run: |
          kubectl create namespace dinehub-dev
          kubectl create secret generic dinehub-jwt \
            --namespace dinehub-dev \
            --from-literal=secret="ci-only-signing-key-long-enough-for-hs256"
          kubectl create secret generic dinehub-db \
            --namespace dinehub-dev \
            --from-literal=username=dinehub --from-literal=password=ci-password
          kubectl create secret generic dinehub-rabbitmq \
            --namespace dinehub-dev \
            --from-literal=username=dinehub --from-literal=password=ci-password

      - name: Deploy the whole chart
        run: |
          helm upgrade --install dinehub deploy/helm/dinehub \
            --namespace dinehub-dev \
            --values deploy/helm/values-dev.yaml \
            --set global.image.tag=ci \
            --set global.image.pullPolicy=Never \
            --atomic --wait --timeout 15m

      - name: What is running
        if: always()
        run: |
          kubectl get pods --namespace dinehub-dev -o wide
          kubectl get svc,ingress --namespace dinehub-dev

      - name: Smoke test
        run: |
          kubectl port-forward --namespace dinehub-dev svc/dinehub-api-gateway 8080:8080 &
          sleep 8
          ./deploy/scripts/smoke-test.sh --url http://localhost:8080 --verbose

      - name: NetworkPolicies do what they claim
        # The smoke test above cannot catch a missing policy: the services hold
        # AMQP connections opened before the policies applied, and an
        # established connection survives a rule that would refuse a new one.
        # This probes from fresh pods, which is the only way a missing rule
        # shows up. It exits 2 — not a failure — on a CNI that ignores
        # NetworkPolicy, because there nothing was proved either way.
        run: |
          set +e
          ./deploy/scripts/verify-network-policies.sh --env dev
          rc=$?
          set -e
          case "$rc" in
            0) echo '| **NetworkPolicies** | verified |' >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo '| **NetworkPolicies** | not enforced by this CNI — unverified |' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo '::error::NetworkPolicy verification failed'; exit 1 ;;
          esac

      - name: Rollback fires on a broken release
        # The deployment jobs rely on `helm upgrade --atomic --wait` putting the
        # previous release back when the new one does not come up. That is a
        # claim about arithmetic the chart controls — see
        # docs/adr/0006-maxunavailable-zero.md, where it was silently false —
        # so it is checked on every run rather than believed.
        run: |
          set +e
          helm upgrade dinehub deploy/helm/dinehub \
            --namespace dinehub-dev \
            --values deploy/helm/values-dev.yaml \
            --set global.image.tag=ci \
            --set global.image.pullPolicy=Never \
            --set defaults.probes.readiness.path=/actuator/health/this-endpoint-does-not-exist \
            --atomic --wait --timeout 3m
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::A release whose readiness probe cannot pass was reported as a successful deploy."
            exit 1
          fi
          # --atomic should have restored the previous release.
          kubectl rollout status deployment/dinehub-order-service --namespace dinehub-dev --timeout=5m
          probe=$(kubectl get deployment dinehub-order-service --namespace dinehub-dev \
                    -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.httpGet.path}')
          if [ "$probe" != "/actuator/health/readiness" ]; then
            echo "::error::The broken release was not rolled back; readiness probe is still ${probe}."
            exit 1
          fi
          echo '| **Automatic rollback** | verified |' >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::pods"
          kubectl get pods --namespace dinehub-dev -o wide
          echo "::endgroup::"
          echo "::group::events"
          kubectl get events --namespace dinehub-dev --sort-by=.lastTimestamp
          echo "::endgroup::"
          for pod in $(kubectl get pods --namespace dinehub-dev -o name); do
            echo "::group::${pod}"
            kubectl describe "$pod" --namespace dinehub-dev | tail -30
            kubectl logs "$pod" --namespace dinehub-dev --tail=80 --all-containers || true
            echo "::endgroup::"
          done

  # -------------------------------------------------------------------------
  # One place to look to see whether the PR is mergeable
  # -------------------------------------------------------------------------
  ci-summary:
    name: CI summary
    needs:
      - build-java
      - integration-tests
      - build-web
      - codeql
      - secrets-scan
      - build-images
      - validate-charts
      - ephemeral-deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write the summary
        run: |
          {
            printf '## CI result\n\n'
            printf '| Check | Result |\n|---|---|\n'
            printf '| Build and unit tests | %s |\n' '${{ needs.build-java.result }}'
            printf '| Integration tests | %s |\n' '${{ needs.integration-tests.result }}'
            printf '| Web | %s |\n' '${{ needs.build-web.result }}'
            printf '| CodeQL | %s |\n' '${{ needs.codeql.result }}'
            printf '| Secret scan | %s |\n' '${{ needs.secrets-scan.result }}'
            printf '| Images and Trivy | %s |\n' '${{ needs.build-images.result }}'
            printf '| Charts and manifests | %s |\n' '${{ needs.validate-charts.result }}'
            printf '| **Ephemeral deploy + smoke** | **%s** |\n\n' '${{ needs.ephemeral-deploy.result }}'
            printf 'Commit `%s` on `%s`.\n' '${{ github.sha }}' '${{ github.ref_name }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if anything that ran did not pass
        # `skipped` is fine — it means the path filter decided that area was not
        # touched. `failure` and `cancelled` are not.
        run: |
          for result in \
            '${{ needs.build-java.result }}' \
            '${{ needs.integration-tests.result }}' \
            '${{ needs.build-web.result }}' \
            '${{ needs.codeql.result }}' \
            '${{ needs.secrets-scan.result }}' \
            '${{ needs.build-images.result }}' \
            '${{ needs.validate-charts.result }}' \
            '${{ needs.ephemeral-deploy.result }}'; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required check reported '${result}'"; exit 1 ;;
            esac
          done
          echo "All required checks passed."
