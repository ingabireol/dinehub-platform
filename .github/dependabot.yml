---
# Dependency updates.
#
# Grouped on purpose: ten separate pull requests for ten patch bumps get
# rubber-stamped or ignored. One grouped PR per ecosystem per week gets read.
version: 2

updates:

  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      test-tooling:
        patterns:
          - "org.testcontainers*"
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
      patch-updates:
        update-types: ["patch"]
    labels: ["dependencies", "java"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular*"
          - "zone.js"
          - "rxjs"
      dev-tooling:
        dependency-type: development
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker
    directories:
      - "/services/api-gateway"
      - "/services/auth-service"
      - "/services/menu-service"
      - "/services/order-service"
      - "/services/payment-service"
      - "/services/kitchen-service"
      - "/services/notification-service"
      - "/web"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    # Actions are pinned to a version in the workflows. Without this, a pinned
    # action silently goes stale and stops receiving security fixes.
