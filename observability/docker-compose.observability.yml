# ---------------------------------------------------------------------------
# Prometheus, Alertmanager, Grafana, Loki and Promtail.
#
# This file is an overlay on deploy/docker-compose.yml, not a stack of its own:
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f observability/docker-compose.observability.yml up -d
#
# which is what `make observability-up` runs. Merging into the same project
# means these containers join the `dinehub` network and can scrape the services
# by name, with no second network and no published ports between them.
#
# Everything is provisioned from files in this directory. Nothing is configured
# through a UI, because a dashboard that exists only in somebody's browser is
# not a dashboard the team has.
#
# Relative paths below are written as `../observability/...` on purpose. Compose
# resolves them against the *project directory*, which is the directory of the
# first `-f` file — `deploy/` — not the directory of the file they appear in.
# Written as `./loki/...` they silently resolve to `deploy/loki/...`, Docker
# creates an empty directory there, and Loki restarts forever complaining that
# its config file is a directory.
# ---------------------------------------------------------------------------
services:

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: dinehub-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle          # POST /-/reload after editing a rule file
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [dinehub]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: dinehub-alertmanager
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks: [dinehub]

  # Receives the webhooks Alertmanager sends and writes them to stdout, so that
  # firing an alert locally produces something you can actually read. It stands
  # in for Slack or PagerDuty, neither of which belongs in a repository.
  alert-sink:
    image: mendhak/http-https-echo:35
    container_name: dinehub-alert-sink
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
      LOG_WITHOUT_NEWLINE: "true"
    networks: [dinehub]

  loki:
    image: grafana/loki:3.2.1
    container_name: dinehub-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks: [dinehub]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  promtail:
    image: grafana/promtail:3.2.1
    container_name: dinehub-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only, and only to discover containers and read their logs. Promtail
      # cannot start, stop or change anything with this; a writable socket would
      # hand root on the host to whatever is inside the container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    networks: [dinehub]
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    container_name: dinehub-grafana
    restart: unless-stopped
    environment:
      # Local only. The real deployment reads these from a Kubernetes Secret and
      # anonymous access is off — see docs/ENVIRONMENTS.md.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      # Open on the overview rather than on an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [dinehub]
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  promtail-positions:
  grafana-data:
