apiVersion: 1

providers:
  - name: dinehub
    orgId: 1
    folder: DineHub
    type: file
    disableDeletion: true
    # The files in the repository are the source of truth. Edits made in the UI
    # are overwritten on the next reload, which is the intended behaviour: a
    # dashboard that only exists in somebody's browser is not a dashboard the
    # team has.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
