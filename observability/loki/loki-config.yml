# ---------------------------------------------------------------------------
# Loki — single-binary, filesystem-backed.
#
# Sized for a laptop and a CI runner, not for a cluster. The retention is
# deliberately short: this is a place to answer "what happened in the last two
# hours", not a log archive. Anything that needs to outlive that belongs in the
# database or in a metric.
# ---------------------------------------------------------------------------
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # A service in a crash loop can produce a remarkable amount of log in a short
  # time. These limits mean it fills its own quota and gets dropped, rather than
  # filling the disk and taking the logging of every other service with it.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 10MB
  max_streams_per_user: 5000
  max_entries_limit_per_query: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  retention_period: 72h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 1h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
