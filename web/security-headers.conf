# ---------------------------------------------------------------------------
# Security headers, included by every location block.
#
# A separate file because nginx's add_header does not merge across blocks: a
# location that sets one header of its own discards every header inherited from
# the server block. Including this everywhere is the only way to be sure they
# are actually present on every response, and `curl -I` on each path is the only
# way to prove it.
# ---------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# The app keeps its token in localStorage, so this is the main mitigation
# against an injected script reading it — not decoration.
#
# style-src allows 'unsafe-inline' because Angular injects component styles at
# runtime. That is a real weakening and it is stated rather than hidden; script-src
# has no such exception, which is the one that matters for token theft.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
