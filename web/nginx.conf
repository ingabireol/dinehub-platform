# ---------------------------------------------------------------------------
# Nginx serving the Angular bundle and proxying /api to the gateway.
#
# Runs as an unprivileged user, so it listens on 8080 rather than 80 — a
# container that needs root to bind a port is a container that runs as root.
# ---------------------------------------------------------------------------

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Everything nginx writes goes under /tmp, because the root filesystem is
  # read-only in Kubernetes.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Version disclosure buys an attacker a shortlist of CVEs for free.
  server_tokens off;

  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"trace_id":"$http_x_trace_id",'
    '"user_agent":"$http_user_agent"'
  '}';

  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---------------------------------------------------
    #
    # Included in every location rather than set once on the server block.
    # nginx's add_header does NOT merge: a location that sets any header of its
    # own discards every add_header inherited from its parent. Setting these
    # here only would silently drop all of them on /index.html, which sets its
    # own Cache-Control — and the headers would be present on some paths and
    # absent on the one that matters most.
    include /etc/nginx/conf.d/security-headers.conf;

    # --- API proxy ----------------------------------------------------------
    location /api/ {
      # The gateway's address comes from the environment, so the same image runs
      # locally and in every cluster.
      proxy_pass ${GATEWAY_URL};

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_connect_timeout 5s;
      proxy_send_timeout    30s;
      proxy_read_timeout    30s;
    }

    # --- Static assets ------------------------------------------------------
    # Build output is fingerprinted, so it can be cached hard.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
      include /etc/nginx/conf.d/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
      try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the fingerprinted
    # assets, so a cached copy pins a user to the previous release.
    location = /index.html {
      include /etc/nginx/conf.d/security-headers.conf;
      add_header Cache-Control "no-store, must-revalidate";
      try_files $uri =404;
    }

    # --- Health -------------------------------------------------------------
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      # No security headers here deliberately: it is a probe endpoint, and
      # keeping the response minimal makes it cheap.
      return 200 "ok\n";
    }

    # --- SPA routing --------------------------------------------------------
    # Any unmatched path is an Angular route, so serve the shell and let the
    # router decide. Without this, a refresh on /orders is a 404.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
