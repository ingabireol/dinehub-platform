---
# ===========================================================================
# test — automatic once the dev smoke tests pass.
#
# Deliberately shaped like production in everything except scale, because the
# point of testing here is to learn something about production. Where it is
# cheaper to differ (replica count, storage) it differs; where differing would
# make the test meaningless (profile, hardening, migrations) it does not.
# ===========================================================================

global:
  environment: test
  logLevel: INFO
  seedData: true          # a known dataset the end-to-end suite asserts against
  swaggerEnabled: true    # this is where people actually explore the API

defaults:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 512Mi }

  strategy:
    # Single replica, so there is nothing to roll: Recreate stops the old pod
    # and starts the new one. It costs a few seconds of downtime, which is free
    # here, and it avoids the surge — seven services each running two Java pods
    # at once does not fit in a 16GB laptop's Docker VM or a free CI runner, and
    # a rollout that fails on memory teaches you nothing about the release.
    #
    # It also keeps `helm --wait` honest: for a non-RollingUpdate strategy the
    # readiness bar is the full replica count, so the deploy still blocks until
    # the new pod is Ready. See docs/adr/0006-maxunavailable-zero.md.
    type: Recreate

services:
  payment-service:
    extraEnv:
      - name: PAYMENT_FAILURE_RATE
        value: "0.1"

ingress:
  host: test.dinehub.local

postgresql:
  storage: 4Gi

rabbitmq:
  storage: 1Gi

backup:
  enabled: false
