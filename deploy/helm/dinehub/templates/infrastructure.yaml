{{/*
  PostgreSQL, RabbitMQ and Redis, in-cluster.

  Real production uses managed instances; docs/ENVIRONMENTS.md records that
  explicitly rather than leaving it implied. These exist so the chart is
  self-contained and a CI runner can deploy the whole platform with no
  dependencies outside the cluster.
*/}}
{{- $full := include "dinehub.fullname" . }}

{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-postgres-init
  labels:
    {{- include "dinehub.labels" . | nindent 4 }}
data:
  init-databases.sh: |
    #!/bin/sh
    # One database per service. Database-per-service is a real boundary even on
    # one instance: no service can query another's tables and each has its own
    # Flyway history.
    set -eu
    for db in {{ range $name, $svc := .Values.services }}{{ if and $svc.enabled $svc.database }}{{ $svc.database }} {{ end }}{{ end }}; do
      echo "Creating ${db}"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<SQL
        SELECT 'CREATE DATABASE ${db}'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${db}')\gexec
    SQL
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-postgresql
  labels:
    {{- include "dinehub.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  serviceName: {{ $full }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "dinehub.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.database }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.database }}
                  key: password
            - name: POSTGRES_DB
              value: postgres
            {{- /* The default mount point is the volume root, which on many
                   storage classes contains a lost+found directory that initdb
                   refuses to work in. */}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d postgres"]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap:
            name: {{ $full }}-postgres-init
            defaultMode: 0o755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-postgresql
  labels:
    {{- include "dinehub.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgresql
spec:
  ports:
    - { port: 5432, targetPort: postgres, name: postgres }
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- if .Values.rabbitmq.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-rabbitmq
  labels:
    {{- include "dinehub.labels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: broker
spec:
  serviceName: {{ $full }}-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "dinehub.labels" . | nindent 8 }}
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: broker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rabbitmq }}
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rabbitmq }}
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_running"] }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-rabbitmq
  labels:
    {{- include "dinehub.labels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
spec:
  ports:
    - { port: 5672, targetPort: amqp, name: amqp }
    - { port: 15672, targetPort: management, name: management }
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-redis
  labels:
    {{- include "dinehub.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "dinehub.labels" . | nindent 8 }}
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          {{- /* Rate-limit counters only. Persistence would mean a volume and a
                 restore story for data that is worthless after a restart. */}}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-redis
  labels:
    {{- include "dinehub.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  ports:
    - { port: 6379, targetPort: redis, name: redis }
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
